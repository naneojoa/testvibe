spring:
  application:
    name: board
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/community}
    username: ${DB_USERNAME:community_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    placeholders:
      admin_email: ${ADMIN_EMAIL:admin@example.invalid}
      admin_password_hash: ${ADMIN_PASSWORD_HASH:$2a$10$invalid.invalid.invalid.invalid.invalid.invalid.invalid.invalid}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
    cookie-secure: ${COOKIE_SECURE:true}
    ip-hmac-secret: ${IP_HMAC_SECRET}
